# The two `spring:` blocks this file used to have were a duplicate top-level key,
# which SnakeYAML rejects outright — the dev profile could not start. Merged into one.
spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

logging:
  level:
    com.cpintel: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
