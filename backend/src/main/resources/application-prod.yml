server:
  # nginx terminates the connection and forwards the caller's address in X-Forwarded-For.
  # Without this the application sees nginx's own address, which made every audit row record
  # the proxy rather than the user, and would have put every caller in one rate-limit bucket.
  # Safe to trust here precisely because the backend port is bound to loopback, so nothing can
  # reach it except through the proxy that sets the header.
  forward-headers-strategy: framework

spring:
  jpa:
    show-sql: false
  flyway:
    validate-on-migrate: true

logging:
  level:
    com.cpintel: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: '{"time":"%d{yyyy-MM-dd HH:mm:ss}","level":"%level","logger":"%logger{36}","requestId":"%X{requestId:-}","msg":"%msg"}%n'

management:
  endpoints:
    web:
      exposure:
        # health for Docker, deploy.sh and nginx; prometheus for the monitoring profile, which
        # scrapes it on the compose network. metrics is left out: everything it says is in
        # prometheus already, and it answered any signed-in user.
        include: health,prometheus
  endpoint:
    health:
      show-details: never

# The API description and its UI are for development (README, "API documentation"). In prod
# they only map the attack surface for whoever reaches the backend; nginx does not route them.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cpintel:
  cors:
    # Stated again so prod can never inherit a list from another profile: empty unless the
    # environment names an origin, and CorsConfig refuses to start on anything but exact ones.
    allowed-origins: ${CPINTEL_CORS_ALLOWED_ORIGINS:}
  runner:
    # On, but never in this process: every run goes to the isolated runner container, which
    # holds none of this backend's secrets and sandboxes each run. SecretsCheck refuses to
    # start prod with the runner on and no url, so it cannot quietly fall back to running
    # submitted code next to the database credentials.
    enabled: ${CPINTEL_RUNNER_ENABLED:true}
    url: ${CPINTEL_RUNNER_URL:http://runner:8090}
