# Security headers for every response of the :443 server.
#
# Included at server level, and again in any location that sets an add_header of its own:
# nginx gives a location either its own add_header lines or the server's, never both, so a
# location that adds one header and does not include this file sends none of these.

# A year of https-only. Not includeSubDomains: a campus domain may have sibling hosts that
# still serve plain http, and this server has no business deciding for them.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# What the page may load. The access token lives in the page's memory, so a script injected
# into it is the one way left to take a session; this limits scripts to CPIntel's own files.
# style 'unsafe-inline' is for Monaco and statement markup; img https: for Codeforces
# statement images and avatars; fonts from Google Fonts; MathJax is served locally.
# The two jsDelivr paths are the compilers the Run button uses outside examinations
# (frontend/src/runner/browser), pinned to exact package versions so nothing else on the CDN
# qualifies — bump them here together with the versions in those workers.
# 'wasm-unsafe-eval' lets the page compile WebAssembly and nothing more; it does not allow eval.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/@yowasp/clang@22.0.0-git20542-10/ https://cdn.jsdelivr.net/npm/pyodide@314.0.7/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net/npm/@yowasp/clang@22.0.0-git20542-10/ https://cdn.jsdelivr.net/npm/pyodide@314.0.7/; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
