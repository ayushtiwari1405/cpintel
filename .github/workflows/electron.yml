name: Electron Build

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The app is a window onto the central server, so the frontend is not bundled; the
      # server's address is stamped in instead. Set it as a repository variable
      # (Settings → Secrets and variables → Actions → Variables → CPINTEL_SERVER_URL).
      - name: Build Electron
        working-directory: electron
        run: |
          npm ci
          npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CPINTEL_SERVER_URL: ${{ vars.CPINTEL_SERVER_URL }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpintel-${{ matrix.os }}
          path: electron/release/**/*
