name: CPIntel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly. Advisories against pinned versions appear on their own schedule, not on ours —
    # Argon2, JJWT, Jsoup and BouncyCastle are all pinned here and nothing was watching them.
    - cron: '0 6 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify rather than test: this runs the suite and then the JaCoCo coverage gate,
      # which fails the build if coverage drops below the floor in pom.xml. The floor is set
      # just under current coverage and is meant to be raised, never lowered.
      - name: Run tests and coverage gate
        working-directory: backend
        run: ./mvnw verify -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

      - name: Build JAR
        working-directory: backend
        run: ./mvnw clean package -DskipTests -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # The commit tag is what a deploy runs and rolls back to; latest is a convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same Dockerfile, the `runner` stage: compiles and runs users' code for the Run button.
      - name: Build and push runner
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: runner
          push: true
          # The commit tag is what a deploy runs and rolls back to; latest is a convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-runner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The edge: TLS and rate limits. Its own image because it picks its certificate at start.
      - name: Build and push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          # Repository variable: where users get the Codeforces extension (may be empty).
          build-args: |
            VITE_CF_EXTENSION_URL=${{ vars.CPINTEL_EXTENSION_URL }}
          push: true
          # The commit tag is what a deploy runs and rolls back to; latest is a convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #deploy:
  #  name: Deploy to VPS
  #  runs-on: ubuntu-latest
  #  needs: docker-build
  #  if: github.ref == 'refs/heads/main'
  #  environment: production
#
  #  steps:
  #    - uses: actions/checkout@v4
#
  #    - name: Deploy via SSH
  #      uses: appleboy/ssh-action@v1
  #      with:
  #        host: ${{ secrets.VPS_HOST }}
   #       username: ${{ secrets.VPS_USER }}
   #       key: ${{ secrets.VPS_SSH_KEY }}
   #       script: |
  #          cd /opt/cpintel
  #          git pull origin main
   #         docker compose pull backend frontend
   #         docker compose up -d --no-deps backend frontend nginx
   #         docker system prune -f
   #         echo "Deploy complete at $(date)"

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    # Reports rather than blocks: a new advisory is not a reason a pull request cannot merge,
    # but it is something somebody should see this week.
    continue-on-error: true
    # Job-level so the steps' if: conditions can see it; secrets cannot be tested in if: directly.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The NVD feed is ~300k records and takes many minutes to pull from scratch. Each run
      # restores the newest copy, updates it incrementally, and saves it under its own key.
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # NVD refuses anonymous API access, so without a key dependency-check aborts before it
      # scans anything. Add an NVD_API_KEY repository secret (free, from
      # https://nvd.nist.gov/developers/request-an-api-key) to enable this step.
      - name: Audit backend dependencies
        if: env.NVD_API_KEY != ''
        working-directory: backend
        run: >
          ./mvnw org.owasp:dependency-check-maven:13.0.0:check -q
          -DfailBuildOnCVSS=9 -DnvdApiKey="$NVD_API_KEY"

      - name: Backend audit skipped
        if: env.NVD_API_KEY == ''
        run: echo "::warning::NVD_API_KEY secret is not set; backend dependency audit skipped."

      # always(): a backend finding should not hide the frontend's.
      - name: Audit frontend dependencies
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=high
