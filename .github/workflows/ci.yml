name: CPIntel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly. Advisories against pinned versions appear on their own schedule, not on ours —
    # Argon2, JJWT, Jsoup and BouncyCastle are all pinned here and nothing was watching them.
    - cron: '0 6 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify rather than test: this runs the suite and then the JaCoCo coverage gate,
      # which fails the build if coverage drops below the floor in pom.xml. The floor is set
      # just under current coverage and is meant to be raised, never lowered.
      - name: Run tests and coverage gate
        working-directory: backend
        run: ./mvnw verify -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/

      - name: Build JAR
        working-directory: backend
        run: ./mvnw clean package -DskipTests -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # The session tests on Node's own runner, then the component and page tests in Vitest
      # (jsdom). Neither needs a browser or the backend.
      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  desktop-and-scripts:
    name: Desktop and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      # The tests compile and run plain modules (away-time accounting, external-link schemes,
      # executable sizes); none of them starts Electron, so its binary is not downloaded.
      - name: Install desktop dependencies
        working-directory: electron
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Desktop tests
        working-directory: electron
        run: npm test

      # Standard library only. The nginx test also starts two throwaway containers (the image
      # nginx/Dockerfile names, and a stub backend) to check the headers and restart answers.
      - name: Codeforces helper tests
        run: python3 -I scripts/test_grab_cf_cookie.py

      - name: Edge nginx tests
        run: python3 -I scripts/test_nginx_edge.py

      # Throwaway mongo:7.0 containers: the backend's least-privilege account on a fresh
      # database (mongo-init.js) and on an existing one (scripts/mongo-app-user.sh).
      - name: MongoDB account tests
        run: python3 -I scripts/test_mongo_app_user.py

  # The libraries inside the backend jar against known vulnerabilities, with Trivy, which needs no
  # key or account (OWASP dependency-check below needs an NVD key and runs only with one). Blocks
  # the images on fixable HIGH or CRITICAL findings; prints everything; see
  # scripts/scan-backend-deps.sh for the policy, the canary and stale-database handling.
  backend-dependency-scan:
    name: Backend dependency scan
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: scan

      # A pinned release checked against the checksum written here, not a third-party action or
      # whatever "latest" points at today.
      - name: Install Trivy 0.75.0
        run: |
          curl -sSfL --retry 3 -o trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy trivy.tgz

      # The databases change daily and are large; each run restores the newest copy, refreshes it
      # and saves it under its own key.
      - name: Cache vulnerability databases
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan the backend jar
        run: |
          jars=(scan/cpintel-backend-*.jar)
          scripts/scan-backend-deps.sh "${jars[0]}" backend-vulnerabilities.json

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-vulnerabilities
          path: backend-vulnerabilities.json
          if-no-files-found: ignore

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, desktop-and-scripts, backend-dependency-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # The commit tag is what a deploy runs and rolls back to; latest is a convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same Dockerfile, the `runner` stage: compiles and runs users' code for the Run button.
      - name: Build and push runner
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: runner
          push: true
          # The commit tag is what a deploy runs and rolls back to; latest is a convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-runner:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The edge: TLS and rate limits. Its own image because it picks its certificate at start.
      - name: Build and push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          # Repository variable: where users get the Codeforces extension (may be empty).
          build-args: |
            VITE_CF_EXTENSION_URL=${{ vars.CPINTEL_EXTENSION_URL }}
          push: true
          # The commit tag is what a deploy runs and rolls back to; latest is a convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #deploy:
  #  name: Deploy to VPS
  #  runs-on: ubuntu-latest
  #  needs: docker-build
  #  if: github.ref == 'refs/heads/main'
  #  environment: production
#
  #  steps:
  #    - uses: actions/checkout@v4
#
  #    - name: Deploy via SSH
  #      uses: appleboy/ssh-action@v1
  #      with:
  #        host: ${{ secrets.VPS_HOST }}
   #       username: ${{ secrets.VPS_USER }}
   #       key: ${{ secrets.VPS_SSH_KEY }}
   #       script: |
  #          cd /opt/cpintel
  #          git pull origin main
   #         docker compose pull backend frontend
   #         docker compose up -d --no-deps backend frontend nginx
   #         docker system prune -f
   #         echo "Deploy complete at $(date)"

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    # Reports rather than blocks: a new advisory is not a reason a pull request cannot merge,
    # but it is something somebody should see this week.
    continue-on-error: true
    # Job-level so the steps' if: conditions can see it; secrets cannot be tested in if: directly.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The NVD feed is ~300k records and takes many minutes to pull from scratch. Each run
      # restores the newest copy, updates it incrementally, and saves it under its own key.
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      # NVD refuses anonymous API access, so without a key dependency-check aborts before it
      # scans anything. Add an NVD_API_KEY repository secret (free, from
      # https://nvd.nist.gov/developers/request-an-api-key) to enable this step. It is a second
      # opinion: the blocking backend scan is the backend-dependency-scan job, which needs no key.
      - name: Audit backend dependencies
        if: env.NVD_API_KEY != ''
        working-directory: backend
        run: >
          ./mvnw org.owasp:dependency-check-maven:13.0.0:check -q
          -DfailBuildOnCVSS=9 -DnvdApiKey="$NVD_API_KEY"

      - name: Backend audit skipped
        if: env.NVD_API_KEY == ''
        run: echo "::warning::NVD_API_KEY secret is not set; backend dependency audit skipped."

      # always(): a backend finding should not hide the frontend's.
      # Only what ships to the browser can fail the build. Dev tooling runs at build time on our
      # own files; Tailwind 3 pulls in braces, which has no fixed release, so that audit only warns.
      - name: Audit frontend dependencies
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend dev dependencies (non-blocking)
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found issues in frontend dev dependencies."
