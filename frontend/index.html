    <!-- Apply the saved (or OS) theme before first paint; ThemeContext keeps it in sync after. -->
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Codeforces writes inline math as $$$...$$$ and relies on MathJax to typeset it.
         Loaded here so scraped statements render the way they do on CF.

         Served from public/mathjax (populated by scripts/copy-mathjax.mjs), not a CDN:
         a blocked jsdelivr — ad blocker, DNS filter, or simply no network in the
         packaged desktop build — leaves every statement as raw $$$ markup, which is
         unreadable. Statements are the core of the Practice and Compete pages, so this
         cannot depend on a third-party host being reachable. -->
    <script src="/mathjax-config.js"></script>
    <script id="MathJax-script" async src="/mathjax/tex-mml-chtml.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
