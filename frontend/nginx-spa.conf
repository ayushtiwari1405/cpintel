server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Everything Vite emits goes under /assets/ with a content hash in its name, so a changed
    # file is a new URL and the old one can be kept for good. A missing file is a 404 here, not
    # the app shell: index.html cached as an immutable script would break the page for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell. Every client-side route falls back to it, and it names the current hashed
    # bundles, so it must be revalidated on each load or a browser keeps starting the old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Whatever else is in public/ keeps its name across builds (theme-init.js,
    # mathjax-config.js, mathjax/), so it is revalidated rather than cached outright. nginx
    # answers the revalidation with 304 from ETag / Last-Modified, which is cheap.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
