# What is worth noticing while a paper is running. Prometheus evaluates these every 15 s; they
# show on its Alerts page (http://127.0.0.1:9090/alerts, over an SSH tunnel) and in Grafana.
# There is no Alertmanager, so nothing is sent anywhere: somebody watches during a sitting.
groups:
  - name: cpintel
    rules:
      - alert: BackendDown
        expr: up{job="cpintel-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: The backend has not answered a scrape for a minute.

      - alert: ServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.2
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: More than one server error every five seconds, for two minutes.

      - alert: RequestsThrottled
        expr: sum(rate(http_server_requests_seconds_count{status="429"}[5m])) > 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Requests are being rate-limited — a lab NAT missing from CPINTEL_LAB_NETWORKS?

      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The slowest 5% of requests take over two seconds.

      - alert: DatabasePoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Requests are waiting for a database connection.

      - alert: HeapNearlyFull
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The backend's heap has been over 90% for five minutes.

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Under 10% of the server's memory is available.

      - alert: DiskNearlyFull
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Under 10% of the root disk is free.

      - alert: CpuSaturated
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The server's CPUs have been over 90% busy for five minutes.
