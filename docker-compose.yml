services:

  postgres:
    image: postgres:16-alpine
    container_name: cpintel-postgres
    environment:
      POSTGRES_DB: cpintel
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port is configurable: a system PostgreSQL on the dev box already owns 5432
      # on many machines. Container-to-container traffic always uses 5432 regardless.
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cpintel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cpintel-net
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: cpintel-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: cpintel
    ports:
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - cpintel-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: cpintel-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cpintel-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpintel-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cpintel
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/cpintel?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS}
      # Required under the prod profile — SecretsCheck refuses to start without it, rather
      # than falling back to a value published in this repository.
      CPINTEL_SESSION_KEY: ${CPINTEL_SESSION_KEY}
      CPINTEL_REGISTRATION_ENABLED: ${CPINTEL_REGISTRATION_ENABLED:-false}
      CPINTEL_ADMIN_EMAIL: ${CPINTEL_ADMIN_EMAIL:-}
      CPINTEL_ADMIN_PASSWORD: ${CPINTEL_ADMIN_PASSWORD:-}
      CPINTEL_ADMIN_USERNAME: ${CPINTEL_ADMIN_USERNAME:-superadmin}
      # DOMjudge, for contests run on a self-hosted judge. Blank leaves the arena
      # Codeforces-only. CPIntel competes as each contestant's own DOMjudge login, attached by
      # an admin; the USER/PASSWORD pair below is an optional service account that buys the
      # contest-wide reads the shared cache needs, and the CREDENTIAL_KEY is what encrypts the
      # attached logins at rest.
      CPINTEL_DOMJUDGE_URL: ${CPINTEL_DOMJUDGE_URL:-}
      CPINTEL_DOMJUDGE_USER: ${CPINTEL_DOMJUDGE_USER:-}
      CPINTEL_DOMJUDGE_PASSWORD: ${CPINTEL_DOMJUDGE_PASSWORD:-}
      CPINTEL_DOMJUDGE_CREDENTIAL_KEY: ${CPINTEL_DOMJUDGE_CREDENTIAL_KEY:-}
      CPINTEL_DOMJUDGE_CREDENTIAL_TTL_DAYS: ${CPINTEL_DOMJUDGE_CREDENTIAL_TTL_DAYS:-30}
      CPINTEL_EXAM_RETENTION_DAYS: ${CPINTEL_EXAM_RETENTION_DAYS:-365}
      CPINTEL_RUNNER_CPP: ${CPINTEL_RUNNER_CPP:-g++}
      CPINTEL_RUNNER_PYTHON: ${CPINTEL_RUNNER_PYTHON:-python3}
      # Encrypts the two passwords that open an examination — the one read out to the room and
      # each candidate's own code. Without it a paper opens for anyone assigned to it; the
      # backend warns at startup rather than refusing, since that is a usable arrangement for a
      # contest-only deployment.
      CPINTEL_EXAM_PASSWORD_KEY: ${CPINTEL_EXAM_PASSWORD_KEY:-}
      CPINTEL_EXAM_PASSWORD_LENGTH: ${CPINTEL_EXAM_PASSWORD_LENGTH:-8}
      # Password resets and account notices. Nothing about an examination is ever mailed.
      # Blank SMTP_HOST is supported: the message is logged instead, which is what a closed
      # exam-lab network with no mail server needs.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CPINTEL_MAIL_FROM: ${CPINTEL_MAIL_FROM:-CPIntel <no-reply@cpintel.local>}
      # Where a link in an email points. Must be the address people open CPIntel at, not the
      # backend's own — behind nginx these are not the same thing.
      CPINTEL_PUBLIC_URL: ${CPINTEL_PUBLIC_URL:-http://localhost}
      CPINTEL_RESET_TOKEN_MINUTES: ${CPINTEL_RESET_TOKEN_MINUTES:-60}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      # Loopback only. nginx reaches the backend over the compose network, so publishing this
      # broadly served no purpose except to offer a way around the edge rate limits and the
      # security headers — and it made X-Forwarded-For spoofable, since a direct caller could
      # set it themselves. With this closed, the header can be trusted.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cpintel-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpintel-frontend
    depends_on:
      - backend
    networks:
      - cpintel-net
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: cpintel-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - cpintel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cpintel-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cpintel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]

  loki:
    image: grafana/loki:2.9.0
    container_name: cpintel-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  cpintel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
