services:

  postgres:
    image: postgres:16-alpine
    container_name: cpintel-postgres
    environment:
      POSTGRES_DB: cpintel
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port is configurable: a system PostgreSQL on the dev box already owns 5432
      # on many machines. Container-to-container traffic always uses 5432 regardless.
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cpintel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cpintel-net
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: cpintel-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: cpintel
    ports:
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - cpintel-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: cpintel-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cpintel-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpintel-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cpintel
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/cpintel?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS}
      # Required under the prod profile — SecretsCheck refuses to start without it, rather
      # than falling back to a value published in this repository.
      CPINTEL_SESSION_KEY: ${CPINTEL_SESSION_KEY}
      CPINTEL_REGISTRATION_ENABLED: ${CPINTEL_REGISTRATION_ENABLED:-false}
      CPINTEL_ADMIN_EMAIL: ${CPINTEL_ADMIN_EMAIL:-}
      CPINTEL_ADMIN_PASSWORD: ${CPINTEL_ADMIN_PASSWORD:-}
      CPINTEL_ADMIN_USERNAME: ${CPINTEL_ADMIN_USERNAME:-superadmin}
      # DOMjudge, for contests run on a self-hosted judge. Blank leaves the arena
      # Codeforces-only. CPIntel competes as each contestant's own DOMjudge login, attached by
      # an admin; the USER/PASSWORD pair below is an optional service account that buys the
      # contest-wide reads the shared cache needs, and the CREDENTIAL_KEY is what encrypts the
      # attached logins at rest.
      CPINTEL_DOMJUDGE_URL: ${CPINTEL_DOMJUDGE_URL:-}
      CPINTEL_DOMJUDGE_USER: ${CPINTEL_DOMJUDGE_USER:-}
      CPINTEL_DOMJUDGE_PASSWORD: ${CPINTEL_DOMJUDGE_PASSWORD:-}
      CPINTEL_DOMJUDGE_CREDENTIAL_KEY: ${CPINTEL_DOMJUDGE_CREDENTIAL_KEY:-}
      CPINTEL_DOMJUDGE_CREDENTIAL_TTL_DAYS: ${CPINTEL_DOMJUDGE_CREDENTIAL_TTL_DAYS:-30}
      CPINTEL_EXAM_RETENTION_DAYS: ${CPINTEL_EXAM_RETENTION_DAYS:-365}
      # Run goes to the runner container below; the backend never executes submitted code.
      CPINTEL_RUNNER_URL: http://runner:8090
      CPINTEL_RUNNER_TOKEN: ${CPINTEL_RUNNER_TOKEN}
      # The backend sizes its wait for a run from this, so it must match the runner's.
      CPINTEL_RUNNER_TIME_LIMIT_MS: ${CPINTEL_RUNNER_TIME_LIMIT_MS:-5000}
      # Lab networks behind one NAT address; the same list nginx gets.
      CPINTEL_LAB_NETWORKS: ${CPINTEL_LAB_NETWORKS:-}
      # Encrypts each candidate's examination sign-in password and the optional room password.
      # Without it no examination can be sat; the backend warns at startup rather than
      # refusing, since a contest-only deployment does not need it.
      CPINTEL_EXAM_PASSWORD_KEY: ${CPINTEL_EXAM_PASSWORD_KEY:-}
      CPINTEL_EXAM_PASSWORD_LENGTH: ${CPINTEL_EXAM_PASSWORD_LENGTH:-8}
      # Password resets and account notices. Nothing about an examination is ever mailed.
      # Blank SMTP_HOST is supported: the message is logged instead, which is what a closed
      # exam-lab network with no mail server needs.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CPINTEL_MAIL_FROM: ${CPINTEL_MAIL_FROM:-CPIntel <no-reply@cpintel.local>}
      # Where a link in an email points. Must be the address people open CPIntel at, not the
      # backend's own — behind nginx these are not the same thing.
      CPINTEL_PUBLIC_URL: ${CPINTEL_PUBLIC_URL:-http://localhost}
      CPINTEL_RESET_TOKEN_MINUTES: ${CPINTEL_RESET_TOKEN_MINUTES:-60}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      # Loopback only. nginx reaches the backend over the compose network, so publishing this
      # broadly served no purpose except to offer a way around the edge rate limits and the
      # security headers — and it made X-Forwarded-For spoofable, since a direct caller could
      # set it themselves. With this closed, the header can be trusted.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cpintel-net
      - runner-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # Compiles and runs users' code for the Run button. Everything here is about containment:
  #   - no secrets: its only configuration is the token the backend uses to call it;
  #   - no internet: runner-net is internal, and the backend is the only other thing on it;
  #   - read-only filesystem, no Linux capabilities, no privilege escalation, capped pids,
  #     CPU and memory — one runaway program cannot take the server down with it;
  #   - every run in its own bubblewrap sandbox (no /home, /etc or network, own PID space),
  #     so concurrent runs cannot see each other's files — in an examination, the next
  #     candidate's solution.
  # Bubblewrap needs unprivileged user namespaces. The seccomp profile is Docker's default
  # plus exactly the five calls that takes (see deploy/runner-seccomp.json), and AppArmor's
  # docker-default profile forbids the mounts bubblewrap makes inside that namespace, hence
  # apparmor:unconfined. If the sandbox still cannot be built, the runner refuses every run
  # rather than running code unsandboxed, and the editor says running is paused.
  runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: cpintel-runner
    environment:
      RUNNER_TOKEN: ${CPINTEL_RUNNER_TOKEN}
      # Runs at once; the rest queue for up to 20 seconds. About one per core.
      RUNNER_CONCURRENCY: ${CPINTEL_RUNNER_CONCURRENCY:-4}
      RUNNER_TIME_LIMIT_MS: ${CPINTEL_RUNNER_TIME_LIMIT_MS:-5000}
      RUNNER_MEMORY_LIMIT_MB: ${CPINTEL_RUNNER_MEMORY_MB:-512}
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/runner-seccomp.json
      - apparmor:unconfined
    networks:
      - runner-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${CPINTEL_RUNNER_CPUS:-4}"
          memory: ${CPINTEL_RUNNER_MEMORY:-4g}
          pids: 1024

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpintel-frontend
    depends_on:
      - backend
    networks:
      - cpintel-net
    restart: unless-stopped

  # The edge. HTTPS on 443; port 80 only redirects, answers Let's Encrypt and serves /health.
  # Certificate: Let's Encrypt (run with --profile letsencrypt), or your own in ./nginx/certs,
  # or a temporary self-signed one until either exists — see nginx/cpintel-cert.sh.
  nginx:
    build:
      context: ./nginx
    container_name: cpintel-nginx
    environment:
      CPINTEL_DOMAIN: ${CPINTEL_DOMAIN:-localhost}
      CPINTEL_LAB_NETWORKS: ${CPINTEL_LAB_NETWORKS:-}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - cpintel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Issues and renews the Let's Encrypt certificate for CPINTEL_DOMAIN. Only for a server the
  # internet can reach on port 80:  docker compose --profile letsencrypt up -d
  # nginx picks the certificate up within a minute of it appearing, and after each renewal.
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: cpintel-certbot
    profiles: ["letsencrypt"]
    environment:
      CPINTEL_DOMAIN: ${CPINTEL_DOMAIN:-}
      CPINTEL_ACME_EMAIL: ${CPINTEL_ACME_EMAIL:-}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        until certbot certonly --webroot -w /var/www/certbot -d "$$CPINTEL_DOMAIN" \
            --email "$$CPINTEL_ACME_EMAIL" --agree-tos --non-interactive --keep-until-expiring; do
          echo "certbot: not issued yet; retrying in 5 minutes"; sleep 300
        done
        while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done
    depends_on:
      - nginx
    networks:
      - cpintel-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cpintel-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cpintel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]

  loki:
    image: grafana/loki:2.9.0
    container_name: cpintel-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]

volumes:
  letsencrypt:
  certbot_www:
  postgres_data:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  # The runner's only network. Internal: nothing on it can reach the internet.
  runner-net:
    internal: true
  cpintel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
