# Every container's logs are capped: Docker keeps json-file logs forever by default, and on a
# small disk that is what eventually fills it. 3 x 10 MB per container is days of history.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: cpintel-postgres
    environment:
      POSTGRES_DB: cpintel
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port is configurable: a system PostgreSQL on the dev box already owns 5432
      # on many machines. Container-to-container traffic always uses 5432 regardless.
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cpintel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cpintel-net
    restart: unless-stopped

  mongodb:
    logging: *default-logging
    image: mongo:7.0
    container_name: cpintel-mongo
    # Left alone, WiredTiger takes half of (RAM - 1 GB) for its cache: 3.5 GB on an 8 GB
    # server, alongside the runner and the backend. CPIntel's Mongo data (the submission
    # archive, statements, files) is small, so 1 GB is plenty and keeps the box inside its RAM.
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: cpintel
      # Read by mongo-init.js, on a first start only, to create the backend's own account.
      MONGO_APP_USER: ${MONGO_APP_USER:-cpintel_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env (the backend's MongoDB account)}
    ports:
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - cpintel-net
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:7.2-alpine
    container_name: cpintel-redis
    # noeviction, not an LRU policy: Redis holds exam access grants and the revoked-sign-in
    # lists, and silently dropping those would lock a candidate out mid-paper or bring a
    # revoked session back. A full Redis refuses writes instead; the caches survive that
    # (CacheErrorConfig), and 512mb is far above what a deployment of this size uses.
    # Append-only, flushed every second: a restart mid-paper loses at most a second of grants
    # and heartbeats rather than up to a minute (--save alone snapshots once a minute). The
    # grants are in Postgres too (V26), so even an empty Redis does not lock a room out.
    #
    # The password reaches redis-server as a config line on its standard input ("-"), not as
    # --requirepass, where the host's process list and `docker inspect` (Config.Cmd) showed it.
    # It is still in the container's environment, which `docker inspect` shows to anyone who
    # can run docker on the host - root and the docker group. In the config line, \ and " are
    # escaped, so any password reads back as written.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        printf 'requirepass "%s"\n' "$$(printf %s "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')"
        | exec redis-server -
        --maxmemory 512mb
        --maxmemory-policy noeviction
        --save 60 1
        --appendonly yes
        --appendfsync everysec
    ports:
      # Bound to loopback, not 0.0.0.0. These publishes exist so the backend can run on
      # the host during development; nothing outside this machine has any reason to reach
      # a datastore directly, and publishing them broadly put the database on the local
      # network behind a password that lives in this repository.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH rather than -a, for the same reason; $$ leaves it to the container's shell.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cpintel-net
    restart: unless-stopped

  backend:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpintel-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cpintel
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # The least-privilege account (readWrite on cpintel), not root: see scripts/mongo-app-user.sh.
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_APP_USER:-cpintel_app}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}@mongodb:27017/cpintel?authSource=cpintel
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      # Required under the prod profile — SecretsCheck refuses to start without it, rather
      # than falling back to a value published in this repository.
      CPINTEL_SESSION_KEY: ${CPINTEL_SESSION_KEY}
      CPINTEL_REGISTRATION_ENABLED: ${CPINTEL_REGISTRATION_ENABLED:-false}
      CPINTEL_ADMIN_EMAIL: ${CPINTEL_ADMIN_EMAIL:-}
      CPINTEL_ADMIN_PASSWORD: ${CPINTEL_ADMIN_PASSWORD:-}
      CPINTEL_ADMIN_USERNAME: ${CPINTEL_ADMIN_USERNAME:-superadmin}
      # DOMjudge, for contests run on a self-hosted judge. Blank leaves the arena
      # Codeforces-only. CPIntel competes as each contestant's own DOMjudge login, attached by
      # an admin; the USER/PASSWORD pair below is an optional service account that buys the
      # contest-wide reads the shared cache needs, and the CREDENTIAL_KEY is what encrypts the
      # attached logins at rest.
      CPINTEL_DOMJUDGE_CREDENTIAL_KEY: ${CPINTEL_DOMJUDGE_CREDENTIAL_KEY:-}
      CPINTEL_EXAM_RETENTION_DAYS: ${CPINTEL_EXAM_RETENTION_DAYS:-365}
      # Run goes to the runner container below; the backend never executes submitted code.
      CPINTEL_RUNNER_URL: http://runner:8090
      CPINTEL_RUNNER_TOKEN: ${CPINTEL_RUNNER_TOKEN}
      # The backend sizes its wait for a run from this, so it must match the runner's.
      CPINTEL_RUNNER_TIME_LIMIT_MS: ${CPINTEL_RUNNER_TIME_LIMIT_MS:-5000}
      # Lab networks behind one NAT address; the same list nginx gets.
      CPINTEL_LAB_NETWORKS: ${CPINTEL_LAB_NETWORKS:-}
      # Other origins allowed to call the API with credentials; empty while the frontend is
      # served by this nginx. See .env.example.
      CPINTEL_CORS_ALLOWED_ORIGINS: ${CPINTEL_CORS_ALLOWED_ORIGINS:-}
      # Optional tuning, documented in .env.example. Listed so that setting one in .env reaches
      # the backend: only what is named here is passed into the container.
      CPINTEL_RUNNER_ENABLED: ${CPINTEL_RUNNER_ENABLED:-true}
      CPINTEL_RUNNER_EXAM_ONLY: ${CPINTEL_RUNNER_EXAM_ONLY:-true}
      CPINTEL_RUNNER_COMPILE_LIMIT_MS: ${CPINTEL_RUNNER_COMPILE_LIMIT_MS:-20000}
      CPINTEL_RUNNER_MEMORY_MB: ${CPINTEL_RUNNER_MEMORY_MB:-512}
      CPINTEL_RATE_LIMIT_ENABLED: ${CPINTEL_RATE_LIMIT_ENABLED:-true}
      CPINTEL_SUBMIT_ENABLED: ${CPINTEL_SUBMIT_ENABLED:-true}
      CPINTEL_SESSION_TTL_DAYS: ${CPINTEL_SESSION_TTL_DAYS:-14}
      CPINTEL_STANDINGS_REFRESH_MS: ${CPINTEL_STANDINGS_REFRESH_MS:-180000}
      CPINTEL_GAUNTLET_RETAKE_DAYS: ${CPINTEL_GAUNTLET_RETAKE_DAYS:-7}
      CPINTEL_PROCTOR_HEARTBEAT_INTERVAL: ${CPINTEL_PROCTOR_HEARTBEAT_INTERVAL:-15}
      CPINTEL_PROCTOR_HEARTBEAT_TTL: ${CPINTEL_PROCTOR_HEARTBEAT_TTL:-45}
      CPINTEL_EXAM_RETENTION_SWEEP_MS: ${CPINTEL_EXAM_RETENTION_SWEEP_MS:-86400000}
      CPINTEL_FILES_IN_CONTEST: ${CPINTEL_FILES_IN_CONTEST:-true}
      CPINTEL_FILES_MAX_FILES: ${CPINTEL_FILES_MAX_FILES:-100}
      CPINTEL_FILES_MAX_FILE_BYTES: ${CPINTEL_FILES_MAX_FILE_BYTES:-2097152}
      CPINTEL_FILES_MAX_TOTAL_BYTES: ${CPINTEL_FILES_MAX_TOTAL_BYTES:-33554432}
      # The desktop app: which GitHub repository's Releases carry its installers (this
      # deployment's own copy of CPIntel, owner/name), a token only if that repository is
      # private, and the oldest installed version still allowed to talk to this server.
      CPINTEL_DESKTOP_REPOSITORY: ${CPINTEL_DESKTOP_REPOSITORY:-}
      CPINTEL_DESKTOP_GITHUB_TOKEN: ${CPINTEL_DESKTOP_GITHUB_TOKEN:-}
      CPINTEL_MIN_DESKTOP_VERSION: ${CPINTEL_MIN_DESKTOP_VERSION:-0.0.0}
      # Installers deploy.sh built for this server (scripts/build-desktop.sh), served before
      # any GitHub release. The whole directory is mounted, not current/ inside it: a new build
      # replaces current/ by renaming, which a mount of current/ itself would never see.
      CPINTEL_DESKTOP_DIR: /desktop
      # Encrypts each candidate's examination sign-in password and the optional room password.
      # Without it no examination can be sat; the backend warns at startup rather than
      # refusing, since a contest-only deployment does not need it.
      CPINTEL_EXAM_PASSWORD_KEY: ${CPINTEL_EXAM_PASSWORD_KEY:-}
      CPINTEL_EXAM_PASSWORD_LENGTH: ${CPINTEL_EXAM_PASSWORD_LENGTH:-8}
      # Password resets and account notices. Nothing about an examination is ever mailed.
      # Blank SMTP_HOST is supported. A closed exam-lab network with no mail server sets
      # CPINTEL_MAIL_LOG_UNDELIVERED=true to have the message, reset link included, logged instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CPINTEL_MAIL_FROM: ${CPINTEL_MAIL_FROM:-CPIntel <no-reply@cpintel.local>}
      CPINTEL_MAIL_LOG_UNDELIVERED: ${CPINTEL_MAIL_LOG_UNDELIVERED:-false}
      # Where a link in an email points. Must be the address people open CPIntel at, not the
      # backend's own — behind nginx these are not the same thing.
      CPINTEL_PUBLIC_URL: ${CPINTEL_PUBLIC_URL:-http://localhost}
      CPINTEL_RESET_TOKEN_MINUTES: ${CPINTEL_RESET_TOKEN_MINUTES:-60}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      # Loopback only. nginx reaches the backend over the compose network, so publishing this
      # broadly served no purpose except to offer a way around the edge rate limits and the
      # security headers — and it made X-Forwarded-For spoofable, since a direct caller could
      # set it themselves. With this closed, the header can be trusted.
      - "127.0.0.1:8080:8080"
    volumes:
      # deploy.sh creates it first: left to Docker, it would be made owned by root, and the
      # build that fills it runs as the deploying user.
      - ./desktop:/desktop:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cpintel-net
      - runner-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # Compiles and runs users' code for the Run button. Everything here is about containment:
  #   - no secrets: its only configuration is the token the backend uses to call it;
  #   - no internet: runner-net is internal, and the backend is the only other thing on it;
  #   - read-only filesystem, no Linux capabilities, no privilege escalation, capped pids,
  #     CPU and memory — one runaway program cannot take the server down with it;
  #   - every run in its own bubblewrap sandbox (no /home, /etc or network, own PID space),
  #     so concurrent runs cannot see each other's files — in an examination, the next
  #     candidate's solution.
  # Bubblewrap needs unprivileged user namespaces. The seccomp profile is Docker's default
  # plus exactly the five calls that takes (see deploy/runner-seccomp.json), and AppArmor's
  # docker-default profile forbids the mounts bubblewrap makes inside that namespace, hence
  # apparmor:unconfined. If the sandbox still cannot be built, the runner refuses every run
  # rather than running code unsandboxed, and the editor says running is paused.
  runner:
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: cpintel-runner
    environment:
      RUNNER_TOKEN: ${CPINTEL_RUNNER_TOKEN}
      # Runs at once; the rest queue for up to 20 seconds. One per core the runner is given.
      RUNNER_CONCURRENCY: ${CPINTEL_RUNNER_CONCURRENCY:-3}
      RUNNER_TIME_LIMIT_MS: ${CPINTEL_RUNNER_TIME_LIMIT_MS:-5000}
      RUNNER_MEMORY_LIMIT_MB: ${CPINTEL_RUNNER_MEMORY_MB:-512}
      RUNNER_COMPILE_TIME_LIMIT_MS: ${CPINTEL_RUNNER_COMPILE_LIMIT_MS:-20000}
    # A reaping PID 1. The image already starts under tini (see the Dockerfile for why every run
    # leaves a process to reap); this is a second one, for an image built before that.
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/runner-seccomp.json
      - apparmor:unconfined
    networks:
      - runner-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Sized for a 4-core, 8 GB server: three cores, leaving one for the backend and the
          # databases while a room is pressing Run, and 3 runs x 512 MB with headroom.
          cpus: "${CPINTEL_RUNNER_CPUS:-3}"
          memory: ${CPINTEL_RUNNER_MEMORY:-2g}
          pids: 1024

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpintel-frontend
    depends_on:
      - backend
    networks:
      - cpintel-net
    restart: unless-stopped

  # The edge. HTTPS on 443; port 80 only redirects, answers Let's Encrypt and serves /health.
  # Certificate: Let's Encrypt (run with --profile letsencrypt), or your own in ./nginx/certs,
  # or a temporary self-signed one until either exists — see nginx/cpintel-cert.sh.
  nginx:
    logging: *default-logging
    build:
      context: ./nginx
    container_name: cpintel-nginx
    environment:
      CPINTEL_DOMAIN: ${CPINTEL_DOMAIN:-localhost}
      CPINTEL_LAB_NETWORKS: ${CPINTEL_LAB_NETWORKS:-}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - cpintel-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Issues and renews the Let's Encrypt certificate for CPINTEL_DOMAIN. Only for a server the
  # internet can reach on port 80:  docker compose --profile letsencrypt up -d
  # nginx picks the certificate up within a minute of it appearing, and after each renewal.
  certbot:
    logging: *default-logging
    image: certbot/certbot:v2.11.0
    container_name: cpintel-certbot
    profiles: ["letsencrypt"]
    environment:
      CPINTEL_DOMAIN: ${CPINTEL_DOMAIN:-}
      CPINTEL_ACME_EMAIL: ${CPINTEL_ACME_EMAIL:-}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        until certbot certonly --webroot -w /var/www/certbot -d "$$CPINTEL_DOMAIN" \
            --email "$$CPINTEL_ACME_EMAIL" --agree-tos --non-interactive --keep-until-expiring; do
          echo "certbot: not issued yet; retrying in 5 minutes"; sleep 300
        done
        while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done
    depends_on:
      - nginx
    networks:
      - cpintel-net
    restart: unless-stopped

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.13.5
    container_name: cpintel-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Sized to sit beside an examination on the 4-core, 8 GB server: a week of history, never
      # more than 1 GB on disk, and capped in memory below. Start it for exam days with
      #   docker compose --profile monitoring up -d
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 384m

  # Emails the alerts in monitoring/alerts.yml to CPINTEL_ALERT_EMAIL (by default the admin
  # address) through the SMTP server password resets use. Without SMTP or an address it runs and
  # sends nothing, and the alerts are on Prometheus's page as before.
  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.34.1
    container_name: cpintel-alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      CPINTEL_MAIL_FROM: ${CPINTEL_MAIL_FROM:-CPIntel <no-reply@cpintel.local>}
      CPINTEL_ALERT_EMAIL: ${CPINTEL_ALERT_EMAIL:-${CPINTEL_ADMIN_EMAIL:-}}
    volumes:
      - ./monitoring/alertmanager-start.sh:/etc/alertmanager/start.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 64m

  # The server itself — CPU, memory, disk — which is what runs out first on exam day.
  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.12.1
    container_name: cpintel-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 64m

  grafana:
    logging: *default-logging
    image: grafana/grafana:12.4.13
    container_name: cpintel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      # Grafana 12 otherwise downloads four app plugins from grafana.com at every start (and
      # keeps updating them). The dashboard uses none of them, and a closed lab network can't
      # reach grafana.com anyway.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - cpintel-net
    restart: unless-stopped
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 256m

  loki:
    logging: *default-logging
    image: grafana/loki:3.7.9
    container_name: cpintel-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - cpintel-net
    restart: unless-stopped
    # Its own profile, out of "monitoring": nothing ships logs to it yet (the containers log to
    # Docker's json-file driver), so on the exam-day profile it would cost memory and hold
    # nothing. Read logs with `docker compose logs backend` until a shipper is added.
    profiles: ["logs"]

volumes:
  letsencrypt:
  certbot_www:
  postgres_data:
  mongo_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:

networks:
  # The runner's only network. Internal: nothing on it can reach the internet.
  runner-net:
    internal: true
  cpintel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
